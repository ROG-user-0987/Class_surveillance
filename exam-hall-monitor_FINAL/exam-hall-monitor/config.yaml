# config.yaml: every threshold and path used by the project lives here.
# Relative paths are relative to the repo root (the folder this file is in).
# Changing a number here should never require editing a .py file.

features:                        # on/off switches for each improvement, for before/after ablations.
                                 # With ALL of these false (and phone.mode: full) the pipeline
                                 # behaves exactly as the original.
  temporal_hysteresis: true      # phone + posture events use EMA + hysteresis (src/temporal.py)
                                 # instead of the simple "present for N seconds" timer
  baseline_calibration: true     # posture measured relative to each student's own first seconds
  evidence_alerts: true          # detailed reason text + a peak-frame thumbnail per alert
  neighbour_peek: true           # head turned toward a neighbour's box (src/cues.py)
  object_passing: true           # a wrist of one student close to a wrist of another
  hands_hidden: true             # head down AND both wrists not visible
  low_visibility: true           # "cannot assess" (grey) when too few keypoints are visible;
                                 # posture alerts are paused for that student meanwhile
  cue_fusion: true               # two different orange cues close together -> ONE combined alert

paths:
  input_video: null              # e.g. data/sample.mp4, or pass --video on the CLI
  output_dir: results
  pose_weights: yolov8n-pose.pt  # Ultralytics downloads it on first run
  phone_weights: yolov8n.pt      # COCO model for now; swap in our fine-tuned best.pt later
  tracker: bytetrack.yaml        # Ultralytics built-in ByteTrack config (or a path to your own)

phone:
  class_id: 67                   # COCO "cell phone". Set to 0 for the fine-tuned 1-class model.
  conf_threshold: 0.25
  min_duration_s: 1.0            # phone must stay near the same person this long before it is flagged
  mode: full                     # "full" = whole frame (original), "sahi" = sliced tiles,
                                 # "crop" = one crop per person around hands/desk (src/detect_phone.py)
  slice_size: 640                # sahi: tile width/height in pixels
  slice_overlap: 0.2             # sahi: overlap ratio between tiles
  crop_pad: 0.25                 # crop: person box grown by this fraction of its size on each side ...
  crop_down_bias: 0.5            # ... with this share of the vertical growth moved downward (hands/desk)
  crop_size: 640                 # crop: crops are resized to this before detection
  nms_iou: 0.5                   # sahi/crop: duplicate boxes overlapping more than this (IoU) are merged

association:                     # how a phone box is given to one person
  keypoint_conf: 0.5             # ignore wrist keypoints below this confidence
  max_wrist_distance: 0.35       # phone centre to wrist, as a fraction of that person's box height
  min_box_overlap: 0.5           # fallback: fraction of the phone box that lies inside the person box

pose:
  person_conf: 0.4               # minimum confidence for a person detection
  keypoint_conf: 0.5             # keypoints below this are ignored by rules and not drawn
  head_turn_threshold: 0.2       # nose offset from shoulder midpoint / shoulder width
                                 # (~0 facing forward, ~0.25 full profile; tune with src.pose_rules)
  min_shoulder_box_ratio: 0.3    # skip head-turn check when shoulders look narrower than this x
                                 # person box width (person is side-on to the camera)
  lean_threshold_deg: 25         # torso angle away from vertical (needs hips visible)
  min_duration_s: 2.0            # head turn / lean must last this long before it is flagged

temporal:                        # EMA + hysteresis settings (src/temporal.py)
  ema_alpha: 0.3                 # smoothing: each new frame counts 30%, history 70%
  phone_on: 0.3                  # smoothed phone confidence that STARTS a phone event ...
  phone_off: 0.15                # ... and below which it ENDS (must be lower than phone_on)
  posture_on: 1.0                # smoothed posture score that starts an event
                                 # (score 1.0 = exactly at pose.head_turn_threshold / lean_threshold_deg)
  posture_off: 0.7               # ... and below which it ends
  cue_on: 0.6                    # yes/no cues (cues: section) are 1 or 0 per frame; smoothed value
  cue_off: 0.3                   # that starts / ends their events
  max_gap_frames: 3              # processed frames an event may be missing or low without ending
                                 # (frames, so it depends on runtime.every_nth_frame)

baseline:                        # used when features.baseline_calibration is true
  baseline_seconds: 20           # learn each student's normal posture in their first N seconds on camera
  min_samples: 10                # measurements needed in that window; fewer = no baseline for that
                                 # signal, and the absolute thresholds keep being used

cues:                            # extra cues (src/cues.py); each has its own features: switch
  kp_conf: 0.5                   # a keypoint counts as visible at or above this confidence
  peek_min_turn: 0.4             # nose offset from the ear midpoint (eyes if ears hidden), in half
                                 # ear-distances, needed to count the head as turned
  peek_max_distance: 2.0         # neighbour's box must start within this many shoulder widths of the nose
  peek_min_s: 2.0                # ... for this long
  pass_distance: 0.5             # wrist-to-wrist distance between two students, in shoulder widths
  pass_min_s: 1.5                # ... for this long
  shoulder_fallback_box_fraction: 0.5  # shoulders hidden: use this x person box width as shoulder width
  head_down_pitch: -0.2          # no baseline: head is "down" when the nose is less than this many
                                 # shoulder widths above the shoulder line (normal is about -0.5)
  head_down_delta: 0.25          # with a baseline: nose this much lower than the student's normal
  hands_hidden_min_s: 5.0        # head down + both wrists hidden for this long
  min_visible_keypoints: 6       # fewer visible keypoints than this = "cannot assess" (grey)
  low_vis_min_s: 2.0             # ... for this long
  fusion_window_s: 3.0           # two different orange cues within this window -> one combined alert
                                 # (orange alerts are held back this long so they can be combined)

seats:
  expected_count: 0              # candidates expected in view; 0 = don't show "people: n/expected"
  zones: []                      # seat polygons in pixel coords of the video; [] = out-of-seat rule off
  #  - id: A1                     # read corner coords off a frame of results/<video>_tracked.mp4
  #    polygon: [[100, 200], [300, 200], [300, 400], [100, 400]]
  max_outside_s: 10              # seconds outside every seat zone before it is flagged

alerts:
  cooldown_s: 30                 # min gap between alerts for the same person + behaviour
  gap_tolerance_s: 0.5           # detections flicker: a behaviour may vanish this long without resetting
  save_clips: true               # save a short review clip for every alert
  clip_before_s: 5               # seconds of video saved before the alert
  clip_after_s: 5                # seconds of video saved after the alert
  tiers:                         # review priority: red = look first, orange = look soon,
    phone: red                   # grey = could not assess (not a detection)
    head_turn: orange
    lean: orange
    out_of_seat: orange
    neighbour_peek: orange
    object_passing: orange
    hands_hidden: orange
    combined: orange
    low_visibility: grey

evaluation:                      # evaluate.py and the detection-mode comparison
  match_tolerance_s: 1.0         # an alert may start/end this many seconds outside a labelled interval
  sweep_conf: [0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6]   # --sweep: phone.conf_threshold
  sweep_min_duration: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 2.5, 3.0]       # --sweep: phone.min_duration_s
  gallery_max: 6                 # --gallery: up to this many false positives and false negatives
  map_conf: 0.01                 # mode comparison: detector confidence used when exporting boxes for mAP
  map_iou: 0.5                   # mode comparison: IoU for a correct box (precision / recall / mAP50)
  gt_class_id: 0                 # mode comparison: phone class id in YOLO-format label files
  fps_warmup: 3                  # mode comparison: images run before timing starts (model warm-up)

metrics:                         # python -m src.metrics (metrics without labels; see src/metrics.py)
  near_threshold_factor: 1.5     # head-turn events whose mean was below this x pose.head_turn_threshold
                                 # count as "barely over the threshold"

runtime:
  every_nth_frame: 2             # process 1 frame in N (2 = half the frames, ~2x faster)
  device: auto                   # auto = GPU if PyTorch sees one (Colab), else CPU; or "cpu" / 0
  imgsz: 640                     # inference image size for both models
  cpu_overrides:                 # used instead of the values above when running on CPU
    every_nth_frame: 3           # fewer frames ...
    imgsz: 480                   # ... and smaller images, so CPU stays usable (small phones get harder)
  fallback_fps: 30               # used only if the video file does not report its FPS
  log_every: 50                  # print progress every N processed frames

live:                            # watching a scan while the video plays
  realtime: true                 # wait so playback is never faster than the real video
  display_width: 960             # live view is shrunk to this width (saved video stays full size)
  jpeg_quality: 80               # notebook live view compression (lower = smoother on slow links)

privacy:
  blur_heads: true               # always true for anything saved or shown
  head_keypoint_conf: 0.3        # low on purpose: better to blur too much than too little
  head_box_scale: 2.5            # head box side = spread of nose/eye/ear points x this
  min_head_width_fraction: 0.3   # head box is at least this fraction of the person box width
  fallback_head_fraction: 0.25   # too few head points: blur this top fraction of the person box
  blur_kernel: 51                # Gaussian kernel size in pixels (made odd automatically)
